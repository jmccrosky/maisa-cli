[project]
name = "maisa-cli"
version = "0.1.0"
description = "CLI to interact with the Maisa (Apotti / Epic MyChart) patient portal from an agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "platformdirs>=4.2",
    # Pinned to 1.60.0 (Chromium build 1223): the newest Playwright that still
    # supports fetching Chromium on macOS 13 (Ventura). Newer versions refuse
    # the download there. Works on newer macOS too.
    "playwright==1.60.0",
    "aiohttp>=3.9",
]

[project.scripts]
maisa = "maisa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maisa"]
